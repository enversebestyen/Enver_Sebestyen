

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Website Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <!-- Complete DESKTOP interface here -->
        <header>
            <h1>Desktop Header</h1>
        </header>
        <main>
            <h2>Desktop Content</h2>
            <p>Add your desktop content here.</p>
        </main>
        <footer>
            <p>&copy; 2026 Your Website</p>
        </footer>
    </div>
    
    <<div class="mobile">
    <!-- Top Bar (Old Twitter style) -->
    <header class="twitter-topbar">
        <button class="menu-btn">☰</button>
        <h1>Twitter</h1>
        <button class="search-btn">🔍</button>
    </header>
    
    <!-- Sidebar Navigation -->
    <nav class="twitter-sidebar">
        <ul>
            <li><a href="#"><strong>Home</strong></a></li>
            <li><a href="#">Notifications</a></li>
            <li><a href="#">Messages</a></li>
            <li><a href="#">Profile</a></li>
        </ul>
    </nav>
    
    <!-- Main Feed -->
    <main class="twitter-feed">
        <div class="tweet-composer">
            <textarea placeholder="What's happening?"></textarea>
            <button>Tweet</button>
        </div>
        
        <!-- Sample Tweets -->
        <article class="tweet">
            <img src="https://via.placeholder.com/40x40/1da1f2/ffffff?text=@" alt="User" class="avatar">
            <div class="tweet-content">
                <strong>@username</strong> <span class="timestamp">2h</span>
                <p>This is a sample tweet from old Twitter mobile!</p>
                <div class="tweet-actions">
                    <button>Reply</button>
                    <button>Retweet</button>
                    <button>Like</button>
                </div>
            </div>
        </article>
    </main>
</div>
</body>
</html>
