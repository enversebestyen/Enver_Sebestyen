<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me - Your Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="desktop">
        <header>
            <h1>Desktop Header</h1>
        </header>
        <main>
            <h2>Desktop Profile Content</h2>
            <p>Your profile information here.</p>
        </main>
        <footer>
            <p>&copy; 2026 Your Website</p>
        </footer>
    </div>
    
    <div class="mobile">
        <header class="mobile-header">
            <div class="logo">MyLogo</div>
        </header>
        
        <main class="mobile-main profile-page">
            <!-- Centered Profile Picture -->
            <div class="profile-picture-container">
                <div class="profile-picture">
                    <img src="https://via.placeholder.com/120x120/1a2332/ffffff?text=YOU" alt="Profile Picture">
                </div>
            </div>
            
            <!-- Bio Container -->
            <div class="profile-bio">
                <h2>Your Name</h2>
                <p class="username">@yourusername</p>
                <p>Your bio goes here. Add your interests, profession, location, or anything you want others to know about you. Keep it short and engaging!</p>
            </div>
            
            <!-- Full-width Banner Image -->
            <div class="profile-banner">
                <img src="https://via.placeholder.com/360x200/253142/8899a6?text=Your+Banner+Image" alt="Profile Banner">
            </div>
        </main>
        
        <footer class="mobile-footer">
            <a href="index.html" class="footer-btn">
                <span class="icon">🏠</span>
                <span class="label">Home</span>
            </a>
            <a href="connect.html" class="footer-btn">
                <span class="icon">🔗</span>
                <span class="label">Connect</span>
            </a>
            <a href="discover.html" class="footer-btn">
                <span class="icon">🔍</span>
                <span class="label">Discover</span>
            </a>
            <a href="me.html" class="footer-btn active">
                <span class="icon">👤</span>
                <span class="label">Me</span>
            </a>
        </footer>
    </div>
</body>
</html>
